
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Afifi Brands</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>


<body>

    <main class="page">

        <!-- Logo & Brand -->
        <section class="profile">

            <div class="logo-circle">
                <img src="logo.png" alt="Afifi Brands Logo">
            </div>

            <h1>Afifi Brands</h1>

            <p class="subtitle">
                Follow us & stay connected
            </p>

        </section>


        <!-- Social Media Links -->
        <section class="links">

            <!-- Instagram -->
            <a
                href="https://www.instagram.com/afifi_15may?igsh=MWtlMXRpdnpybTZxMA=="
                target="_blank"
                rel="noopener noreferrer"
                class="social-link"
            >

                <span class="icon">
                    <i class="fa-brands fa-instagram"></i>
                </span>

                <span class="link-name">
                    Instagram
                </span>

                <span class="arrow">
                    <i class="fa-solid fa-chevron-right"></i>
                </span>

            </a>


            <!-- Facebook -->
            <a
                href="https://www.facebook.com/share/1HTa3fycKk/"
                target="_blank"
                rel="noopener noreferrer"
                class="social-link"
            >

                <span class="icon">
                    <i class="fa-brands fa-facebook-f"></i>
                </span>

                <span class="link-name">
                    Facebook
                </span>

                <span class="arrow">
                    <i class="fa-solid fa-chevron-right"></i>
                </span>

            </a>


            <!-- TikTok -->
            <a
                href="https://www.tiktok.com/@afifi9087?_r=1&_t=ZS-98qKpsnUTpQ"
                target="_blank"
                rel="noopener noreferrer"
                class="social-link"
            >

                <span class="icon">
                    <i class="fa-brands fa-tiktok"></i>
                </span>

                <span class="link-name">
                    TikTok
                </span>

                <span class="arrow">
                    <i class="fa-solid fa-chevron-right"></i>
                </span>

            </a>

        </section>


        <!-- Footer -->
        <footer>
            <p>© 2026 Afifi Brands</p>
        </footer>

    </main>

</body>

</html>
